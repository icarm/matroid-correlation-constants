# Numeric threshold screening for family proposals, following the draft
# site's design: parse the claimed supremum fraction from the issue form,
# compare it exactly against the 4/3 publication threshold, and post one
# status label plus a comment. This screening verifies NOTHING mathematical —
# not the construction, the curve formula, or the proof; it only sorts the
# review queue. Editing the issue reruns it.

name: Classify family proposal

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: family-proposal-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Threshold screening before mathematical review
    if: startsWith(github.event.issue.title, '[Family]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Screen the claimed supremum against 4/3
        uses: actions/github-script@v8
        with:
          script: |
            const MARKER = '<!-- family-threshold-screening -->'
            const LABELS = ['eligible-for-review', 'below-publication-thresholds', 'verification-failed']
            const issue = context.payload.issue

            // Issue-form bodies render each field as "### <label>\n\n<value>".
            const field = (label) => {
              const m = issue.body?.match(new RegExp('###\\s*' + label + '\\s*\\n+([^\\n#][^\\n]*)'))
              const value = m ? m[1].trim() : ''
              return value === '_No response_' ? '' : value
            }
            const numText = field('Claimed supremum numerator')
            const denText = field('Claimed supremum denominator')

            let label, message
            if (!/^\d{1,15}$/.test(numText) || !/^[1-9]\d{0,14}$/.test(denText)) {
              label = 'verification-failed'
              message =
                'Could not parse the claimed supremum: expected a nonnegative integer ' +
                'numerator and a positive integer denominator, got ' +
                `numerator ${JSON.stringify(numText)} and denominator ${JSON.stringify(denText)}. ` +
                'Edit the issue to rerun this screening.'
            } else {
              // Exact comparison in BigInt: claimed >= 4/3  <=>  3*num >= 4*den.
              const eligible = 3n * BigInt(numText) >= 4n * BigInt(denText)
              const value = Number(numText) / Number(denText)
              label = eligible ? 'eligible-for-review' : 'below-publication-thresholds'
              message = eligible
                ? `The claimed supremum ${numText}/${denText} ≈ ${value.toFixed(6)} meets the ` +
                  '4/3 publication threshold — **marked eligible for human review**.'
                : `The claimed supremum ${numText}/${denText} ≈ ${value.toFixed(6)} is below the ` +
                  '4/3 publication threshold, so this proposal is marked below-publication-thresholds. ' +
                  'It remains visible and may still be reviewed.'
            }
            message +=
              '\n\nThis is numeric screening only: it does not verify the construction, ' +
              'the curve formula, the existence conditions, or the proof — those need ' +
              'human mathematical review. Acceptance is a curatorial decision; accepted ' +
              "families are added to the site's catalog by pull request."

            // Exactly one status label.
            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              ...context.repo, issue_number: issue.number,
            })
            for (const l of current) {
              if (LABELS.includes(l.name) && l.name !== label) {
                await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: issue.number, name: l.name,
                })
              }
            }
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: issue.number, labels: [label],
            })

            // Upsert the screening comment rather than piling up duplicates.
            const body = `${MARKER}\n**Threshold screening**\n\n${message}`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: issue.number, per_page: 100,
            })
            const existing = comments.find((c) => c.body?.includes(MARKER))
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number, body,
              })
            }
