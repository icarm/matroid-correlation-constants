# Test on every push and pull request; on pushes to main, apply the remote D1
# migrations and deploy the worker.
#
# One-time setup: create a Cloudflare API token (the "Edit Cloudflare
# Workers" template, plus Account → D1 → Edit for the migrations) and add it
# to the repository as the CLOUDFLARE_API_TOKEN secret. The account id lives
# in wrangler.jsonc; the worker's own secrets (GITHUB_CLIENT_ID/SECRET for
# OAuth) are set via `wrangler secret put` and are untouched by deploys.

name: deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migrations first, then the code that expects them — the same order as
      # a manual deploy. Migrations are idempotent (already-applied ones are
      # skipped), so a code-only push is safe.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply matroid-correlation-constants --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
